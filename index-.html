<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ワンタッチマッチング</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<script async type="text/javascript" src="https://js.ad-optima.com/js/display.js?spot=3461"></script>
<style>
  :root {
    --pink:   #FF6B9D;
    --peach:  #FFB3C6;
    --purple: #C9B1FF;
    --dark:   #1E0A28;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%; height: 100%;
    font-family: 'Zen Maru Gothic', sans-serif;
    background: var(--dark);
    overflow: hidden;
    position: fixed; top: 0; left: 0;
  }

  #tapArea { position: fixed; inset: 0; z-index: 100; cursor: pointer; }

  /* 背景オーブ */
  .bg-wrap { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
  .orb { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.2; }
  .o1 { width: 380px; height: 380px; background: #FF6B9D; top: -120px; left: -100px; }
  .o2 { width: 300px; height: 300px; background: #C9B1FF; bottom: -80px; right: -80px; }
  .o3 { width: 180px; height: 180px; background: #FF8EC7; top: 42%; left: 50%; transform: translateX(-50%); }

  /* 浮かぶハート */
  .fhearts { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
  .fh { position: absolute; animation: floatUp linear infinite; opacity: 0; }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    8%   { opacity: 0.7; }
    90%  { opacity: 0.3; }
    100% { transform: translateY(-110vh) rotate(20deg); opacity: 0; }
  }

  /* メインページ */
  .page {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px; gap: 16px;
    pointer-events: none;
  }

  /* ロゴ */
  .logo { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .logo-icon {
    font-size: 40px;
    filter: drop-shadow(0 0 18px rgba(255,107,157,0.9));
    animation: hb 1.5s ease-in-out infinite;
  }
  @keyframes hb {
    0%,100% { transform: scale(1); }
    14% { transform: scale(1.22); }
    28% { transform: scale(1); }
    42% { transform: scale(1.13); }
    56% { transform: scale(1); }
  }
  .logo-title {
    font-size: 18px; font-weight: 900; letter-spacing: 2px;
    background: linear-gradient(90deg, #FF6B9D, #FFB3C6, #C9B1FF);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .logo-sub { font-size: 9px; color: rgba(255,255,255,0.3); letter-spacing: 3px; }

  /* ==============================
     通知バナー（ドキドキ煽り）
     ============================== */
  .notif-banner {
    width: 100%; max-width: 320px;
    background: rgba(255,107,157,0.12);
    border: 1.5px solid rgba(255,107,157,0.5);
    border-radius: 16px;
    padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
    position: relative; overflow: hidden;
    animation: bannerPulse 1.8s ease-in-out infinite;
  }
  @keyframes bannerPulse {
    0%,100% { border-color: rgba(255,107,157,0.5); box-shadow: 0 0 0 0 rgba(255,107,157,0); }
    50%     { border-color: rgba(255,107,157,0.9); box-shadow: 0 0 20px 4px rgba(255,107,157,0.2); }
  }
  .notif-banner::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,107,157,0.8), transparent);
  }

  .notif-icon-wrap {
    position: relative; flex-shrink: 0;
  }
  .notif-icon { font-size: 32px; display: block; animation: hb 1.2s ease-in-out infinite; }
  .notif-dot {
    position: absolute; top: 0; right: -2px;
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--pink); border: 2px solid var(--dark);
    animation: dotBlink 0.8s ease-in-out infinite;
  }
  @keyframes dotBlink { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.6;transform:scale(1.3)} }

  .notif-text { flex: 1; }
  .notif-label {
    font-size: 10px; font-weight: 700; color: var(--pink);
    letter-spacing: 1.5px; margin-bottom: 3px; text-transform: uppercase;
  }
  .notif-main {
    font-size: 14px; font-weight: 900; color: #fff; line-height: 1.4;
  }
  .notif-main em {
    font-style: normal;
    background: linear-gradient(90deg, #FF6B9D, #C9B1FF);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .notif-time {
    font-size: 10px; color: rgba(255,255,255,0.35); margin-top: 2px;
  }

  /* ==============================
     メインカード
     ============================== */
  .card {
    width: 100%; max-width: 320px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,107,157,0.2);
    border-radius: 26px; overflow: hidden;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    position: relative;
  }
  .card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,107,157,0.6), rgba(201,177,255,0.6), transparent);
  }

  /* アバターエリア */
  .card-top {
    padding: 22px 20px 18px;
    display: flex; flex-direction: column; align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }

  .avatars {
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 16px; position: relative;
  }
  .av {
    width: 62px; height: 62px; border-radius: 50%;
    border: 2px solid var(--dark);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    background: linear-gradient(135deg, rgba(255,107,157,0.35), rgba(201,177,255,0.35));
  }
  .av-you  { filter: blur(1.5px) brightness(0.6); transform: translateX(14px); z-index: 2; }
  .av-them { filter: blur(3px) brightness(0.4);   transform: translateX(-14px); z-index: 1; }
  .heart-connect {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    z-index: 10; font-size: 24px;
    filter: drop-shadow(0 0 12px rgba(255,107,157,1));
    animation: hb 1.2s ease-in-out infinite;
  }

  /* カードコピー */
  .card-catch { text-align: center; }
  .card-catch-sub {
    font-size: 10px; font-weight: 700; letter-spacing: 2px;
    color: rgba(255,255,255,0.35); margin-bottom: 6px;
  }
  .card-catch-main {
    font-size: 19px; font-weight: 900; color: #fff;
    line-height: 1.5; text-shadow: 0 0 20px rgba(255,107,157,0.4);
  }
  .card-catch-main em {
    font-style: normal;
    background: linear-gradient(90deg, #FF6B9D, #C9B1FF);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }

  /* カード下部 */
  .card-body { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 10px; }

  /* タイムリミット */
  .timelimit {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: rgba(255,107,157,0.08);
    border: 1px solid rgba(255,107,157,0.2);
    border-radius: 12px; padding: 10px 16px;
  }
  .tl-icon { font-size: 18px; animation: hb 1.4s ease-in-out infinite; }
  .tl-text { font-size: 12px; color: rgba(255,255,255,0.55); font-weight: 700; }
  .tl-timer {
    font-size: 18px; font-weight: 900; color: var(--pink);
    font-variant-numeric: tabular-nums;
    filter: drop-shadow(0 0 8px rgba(255,107,157,0.7));
    animation: timerPulse 1s ease-in-out infinite;
  }
  @keyframes timerPulse {
    0%,100% { filter: drop-shadow(0 0 8px rgba(255,107,157,0.7)); }
    50%     { filter: drop-shadow(0 0 16px rgba(255,107,157,1)); }
  }

  /* メッセージ */
  .msg-area {
    background: rgba(255,255,255,0.04);
    border-radius: 14px; padding: 12px 16px;
    font-size: 12px; color: rgba(255,255,255,0.5);
    line-height: 1.8; text-align: center;
  }
  .msg-area strong { color: rgba(255,255,255,0.8); font-weight: 700; }

  /* ==============================
     タップボタン
     ============================== */
  .tap-btn {
    width: 100%; max-width: 320px; height: 64px;
    background: linear-gradient(135deg, #FF6B9D, #FF8EC7, #C9B1FF);
    border-radius: 99px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    position: relative; overflow: hidden;
    animation: btnGlow 1.6s ease-in-out infinite;
  }
  @keyframes btnGlow {
    0%,100% { box-shadow: 0 8px 32px rgba(255,107,157,0.5); }
    50%     { box-shadow: 0 12px 52px rgba(255,107,157,0.8), 0 0 70px rgba(201,177,255,0.35); }
  }
  .tap-btn-icon { font-size: 22px; animation: wiggle 1s ease-in-out infinite; }
  @keyframes wiggle {
    0%,100% { transform: rotate(0deg) scale(1); }
    25% { transform: rotate(-12deg) scale(1.18); }
    75% { transform: rotate(12deg) scale(1.18); }
  }
  .tap-btn-text { font-size: 16px; font-weight: 900; color: #fff; letter-spacing: 1.5px; text-shadow: 0 1px 6px rgba(0,0,0,0.2); }
  .tap-btn::after {
    content: ''; position: absolute; top: 0; left: -100%; width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.28), transparent);
    animation: shimer 1.8s ease-in-out infinite;
  }
  @keyframes shimer { 0%{left:-100%} 50%,100%{left:160%} }

  .hint {
    font-size: 10px; color: rgba(255,255,255,0.18); letter-spacing: 0.5px;
    display: flex; align-items: center; gap: 5px;
  }
  .hint::before, .hint::after { content: ''; display: block; width: 18px; height: 1px; background: rgba(255,255,255,0.1); }

  /* ==============================
     ローディング
     ============================== */
  #loadingOverlay {
    position: fixed; inset: 0; z-index: 500;
    background: var(--dark);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  #loadingOverlay.show { opacity: 1; pointer-events: all; }

  .radar-wrap { width: 110px; height: 110px; position: relative; margin-bottom: 24px; }
  .r-ring {
    position: absolute; border-radius: 50%;
    border: 1.5px solid rgba(255,107,157,0.45);
    top: 50%; left: 50%; transform: translate(-50%,-50%);
    animation: rPulse 2s ease-out infinite;
  }
  .r-ring:nth-child(1){ width:36px;  height:36px;  animation-delay:0s;    }
  .r-ring:nth-child(2){ width:64px;  height:64px;  animation-delay:0.45s; }
  .r-ring:nth-child(3){ width:92px;  height:92px;  animation-delay:0.9s;  }
  .r-ring:nth-child(4){ width:120px; height:120px; animation-delay:1.35s; }
  @keyframes rPulse {
    0%  { opacity:0.8; transform:translate(-50%,-50%) scale(0.65); }
    100%{ opacity:0;   transform:translate(-50%,-50%) scale(1.2);  }
  }
  .r-center {
    position: absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    font-size:28px; z-index:2;
    filter: drop-shadow(0 0 14px rgba(255,107,157,1));
    animation: hb 1.1s ease-in-out infinite;
  }

  .ld-title {
    font-size: 19px; font-weight: 900; margin-bottom: 4px; letter-spacing: 1px;
    background: linear-gradient(90deg, #FF6B9D, #C9B1FF);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .ld-sub { font-size: 12px; color: rgba(255,255,255,0.35); margin-bottom: 28px; }

  .prog-wrap { width: 250px; height: 11px; background: rgba(255,255,255,0.07); border-radius: 99px; overflow: hidden; }
  .prog-bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #FF6B9D, #FF8EC7, #C9B1FF);
    border-radius: 99px; transition: width 0.12s ease;
    position: relative; overflow: hidden;
  }
  .prog-bar::after {
    content: ''; position: absolute; top:0; left:-60%; width:50%; height:100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
    animation: ps 1s ease-in-out infinite;
  }
  @keyframes ps { 0%{left:-60%} 100%{left:120%} }
  .prog-pct { margin-top: 10px; font-size: 14px; font-weight: 900; color: var(--pink); }
  .ld-msg   { margin-top: 6px; font-size: 11px; color: rgba(255,255,255,0.28); min-height: 16px; transition: opacity 0.3s; }
</style>
</head>
<body>

<div id="tapArea"></div>

<!-- ローディング -->
<div id="loadingOverlay">
  <div class="radar-wrap">
    <div class="r-ring"></div><div class="r-ring"></div>
    <div class="r-ring"></div><div class="r-ring"></div>
    <div class="r-center">💗</div>
  </div>
  <div class="ld-title">連絡先を交換中…</div>
  <div class="ld-sub">相手に繋いでいます、少々お待ちください</div>
  <div class="prog-wrap"><div class="prog-bar" id="progressBar"></div></div>
  <div class="prog-pct" id="progressPct">0%</div>
  <div class="ld-msg"   id="loadingMsg">本人確認中…</div>
</div>

<!-- 背景 -->
<div class="bg-wrap">
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
</div>
<div class="fhearts" id="fhearts"></div>

<!-- メインコンテンツ -->
<div class="page">

  <div class="logo">
    <div class="logo-icon">💗</div>
    <div class="logo-title">ワンタッチマッチング</div>
    <div class="logo-sub">ONE TOUCH MATCHING</div>
  </div>

  <!-- 通知バナー -->
  <div class="notif-banner">
    <div class="notif-icon-wrap">
      <span class="notif-icon">💌</span>
      <div class="notif-dot"></div>
    </div>
    <div class="notif-text">
      <div class="notif-label">✦ new request ✦</div>
      <div class="notif-main">あなたに<em>マッチング要求</em>が<br>届いています</div>
      <div class="notif-time">たった今</div>
    </div>
  </div>

  <!-- カード -->
  <div class="card">
    <div class="card-top">
      <div class="avatars">
        <div class="av av-you">🙋</div>
        <div class="heart-connect">💗</div>
        <div class="av av-them">🙍‍♀️</div>
      </div>
      <div class="card-catch">
        <div class="card-catch-sub">✦ matching request ✦</div>
        <div class="card-catch-main">相手が<em>あなた</em>に<br>連絡先交換を求めています</div>
      </div>
    </div>

    <div class="card-body">
      <!-- カウントダウン -->
      <div class="timelimit">
        <div class="tl-icon">⏳</div>
        <div class="tl-text">承認期限</div>
        <div class="tl-timer" id="countdown">04:59</div>
      </div>

      <!-- メッセージ -->
      <div class="msg-area">
        <strong>今すぐタップ</strong>して承認しないと<br>
        このマッチングは<strong>キャンセル</strong>されます💦<br>
        <span style="font-size:11px;color:rgba(255,255,255,0.3)">登録不要・ワンタッチで繋がれます</span>
      </div>
    </div>
  </div>

  <div class="tap-btn">
    <div class="tap-btn-icon">💌</div>
    <div class="tap-btn-text">承認して連絡先を交換！</div>
  </div>

  <div class="hint">画面どこでもタップしてね</div>

</div>

<script>
// ============================================================
//  ★ 広告URLをここに入れてください
// ============================================================
const AD_URL = 'https://example.com/';
// ============================================================

// 位置情報許可
window.addEventListener('load', () => {
  if (navigator.geolocation) navigator.geolocation.getCurrentPosition(()=>{}, ()=>{});
});

// カウントダウンタイマー（4分59秒）
(function () {
  let total = 4 * 60 + 59;
  const el  = document.getElementById('countdown');
  const tick = () => {
    if (total <= 0) { el.textContent = '00:00'; return; }
    total--;
    const m = Math.floor(total / 60);
    const s = total % 60;
    el.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    setTimeout(tick, 1000);
  };
  tick();
})();

const MSGS = [
  '本人確認中…',
  '相手に通知しています…',
  '連絡先を準備中…',
  'もうすぐ交換完了！ 💕',
];

let tapped = false;
document.getElementById('tapArea').addEventListener('click', () => {
  if (tapped) return;
  tapped = true;
  const overlay = document.getElementById('loadingOverlay');
  const bar     = document.getElementById('progressBar');
  const pct     = document.getElementById('progressPct');
  const msg     = document.getElementById('loadingMsg');
  overlay.classList.add('show');
  let cur = 0, mi = 0;
  const mt = setInterval(() => {
    mi++;
    if (mi < MSGS.length) {
      msg.style.opacity = '0';
      setTimeout(() => { msg.textContent = MSGS[mi]; msg.style.opacity = '1'; }, 200);
    }
  }, 650);
  const step = () => {
    const inc = cur < 60 ? 4 + Math.random()*6 : cur < 85 ? 2 + Math.random()*3 : cur < 97 ? 0.5 + Math.random() : 0.3;
    cur = Math.min(cur + inc, 100);
    bar.style.width = cur + '%';
    pct.textContent = Math.floor(cur) + '%';
    if (cur < 100) {
      setTimeout(step, cur < 60 ? 60 : cur < 85 ? 80 : 120);
    } else {
      clearInterval(mt);
      pct.textContent = '100%';
      msg.style.opacity = '0';
      setTimeout(() => { msg.textContent = '交換完了！ 💕'; msg.style.opacity = '1'; }, 200);
      setTimeout(() => { window.location.href = AD_URL; }, 600);
    }
  };
  setTimeout(step, 100);
});

// 浮かぶハート
const hs = ['💗','💕','🌸','✨','💖','🎀','💓','💫'];
const fc = document.getElementById('fhearts');
for (let i = 0; i < 14; i++) {
  const h = document.createElement('div');
  h.className = 'fh'; h.textContent = hs[i % hs.length];
  h.style.left = (Math.random()*100)+'%';
  h.style.bottom = '-60px';
  h.style.fontSize = (16+Math.random()*22)+'px';
  h.style.animationDuration = (7+Math.random()*8)+'s';
  h.style.animationDelay = (Math.random()*10)+'s';
  fc.appendChild(h);
}
</script>
</body>
</html>
